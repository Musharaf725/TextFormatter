<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Online Learning Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Form Container -->
    <div class="bg-white max-w-xl w-full p-8 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Registration Form</h2>
        
        <!-- Form tag with required action and method -->
        <form action="/register" method="POST" class="space-y-4">
            
            <!-- 1. Full Name -->
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" name="fullName" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- 2. Email Address -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- 3. Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- 4. Confirm Password -->
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- 5. Mobile Number -->
            <div>
                <label for="mobile" class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                <input type="number" id="mobile" name="mobile" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- 6. Date of Birth -->
            <div>
                <label for="dob" class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                <input type="date" id="dob" name="dob" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- 7. Gender -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Gender</label>
                <div class="flex items-center space-x-6">
                    <label class="inline-flex items-center">
                        <input type="radio" id="male" name="gender" value="Male" required class="text-blue-600 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">Male</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" id="female" name="gender" value="Female" class="text-blue-600 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">Female</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" id="other" name="gender" value="Other" class="text-blue-600 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">Other</span>
                    </label>
                </div>
            </div>

            <!-- 8. Course Selection -->
            <div>
                <label for="course" class="block text-sm font-medium text-gray-700 mb-1">Course Selection</label>
                <select id="course" name="course" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Please Select --</option>
                    <option value="Java">Java Programming</option>
                    <option value="WebDev">Web Development</option>
                    <option value="DataScience">Data Science</option>
                    <option value="Python">Python for Beginners</option>
                </select>
            </div>

            <!-- 9. Hobbies -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Hobbies (Select at least 3)</label>
                <div class="grid grid-cols-2 gap-2">
                    <label class="inline-flex items-center">
                        <input type="checkbox" id="reading" name="hobbies" value="Reading" class="rounded text-blue-600 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">Reading</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="checkbox" id="coding" name="hobbies" value="Coding" class="rounded text-blue-600 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">Coding</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="checkbox" id="sports" name="hobbies" value="Sports" class="rounded text-blue-600 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">Sports</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="checkbox" id="music" name="hobbies" value="Music" class="rounded text-blue-600 focus:ring-blue-500">
                        <span class="ml-2 text-gray-700">Music</span>
                    </label>
                </div>
            </div>

            <!-- 10. Address -->
            <div>
                <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                <textarea id="address" name="address" rows="3" required
                          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit" 
                        class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                    Register
                </button>
            </div>

        </form>
    </div>

</body>
</html>
